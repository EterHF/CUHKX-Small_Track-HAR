[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cuhkx-visual-temporal"
version = "1.0.0"
description = "Source release of compact visual-temporal fusion for the CUHK-X Small Model Track"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "numpy",
  "pandas",
  "Pillow",
  "PyYAML",
  "scikit-learn",
  "torch",
  "torchvision",
  "ultralytics",
]

[project.scripts]
cuhkx-replay = "visual_temporal.release.replay:main"
cuhkx-build-bundle = "visual_temporal.release.bundle:main"
cuhkx-train-temporal = "visual_temporal.training.temporal_suite:main"

[tool.setuptools.packages.find]
include = ["visual_temporal*"]
